spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/code_clinic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql

ai:
  deepseek:
    mock-enabled: ${AI_MOCK_ENABLED:true}
