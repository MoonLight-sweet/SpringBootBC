server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: code-clinic
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/code_clinic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-mysql.sql
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:code-clinic-local-secret-key-change-before-production}
    expiration-hours: 24
  password-reset:
    code-expiry-minutes: 10
    mail-from: ${MAIL_FROM:}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    mock-enabled: ${AI_MOCK_ENABLED:true}
    timeout-seconds: 35
    max-retries: 2

logging:
  level:
    com.codeclinic: info
