server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: code-clinic
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  datasource:
    url: jdbc:h2:file:./data/codeclinic;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:code-clinic-local-secret-key-change-before-production}
    expiration-hours: 24

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    mock-enabled: ${AI_MOCK_ENABLED:true}
    timeout-seconds: 35
    max-retries: 2

logging:
  level:
    com.codeclinic: info
