server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: code-clinic
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/code_clinic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      # 使用只具备数据读写权限的账号时，首次建表后设置SQL_INIT_MODE=never。
      encoding: UTF-8
      schema-locations: classpath:schema-mysql.sql
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 24
  password-reset:
    code-expiry-minutes: 10
    mail-from: ${MAIL_FROM:}
    setup-token: ${MAIL_SETUP_TOKEN:}

ai:
  # 仅用于单实例部署；共享数据库的多实例必须关闭并采用任务归属恢复。
  recover-on-startup: ${AI_RECOVER_ON_STARTUP:true}
  daily-limit: ${AI_DAILY_LIMIT:20}
  global-concurrency: ${AI_GLOBAL_CONCURRENCY:3}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:http://127.0.0.1:11434/v1}
    model: ${DEEPSEEK_MODEL:qwen3:8b}
    mock-enabled: ${AI_MOCK_ENABLED:false}
    timeout-seconds: 35
    max-retries: 2

logging:
  level:
    com.codeclinic: info
